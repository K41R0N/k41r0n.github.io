# Harness Standard v0.3 applicability (restated 2026-11-25; partial by design).
# APPLIED, with the Standard clause each maps to: 5.1 layout; 5.4
# never-in-repo rules; 6.7 golden-set evals (evals/, fail-closed runner);
# 7.3 decision contracts (decisions/, routines/); 9.4/9.5 SKILL and delivery
# contracts; section 11 pack contract (packs/); section 13 sensitivity.
# NOT APPLICABLE TODAY: this is a knowledge/methods library attached to a
# static site, not an operator cell, so cells/runtime (12, 14), model routing
# (8) and system_one (7) have nothing to attach to. That is a scoping
# statement, not a claim that the contracts are met.
# REMAINING GAPS (not solved by this comment), clause-precise:
# - 5.3 harness.lock: most of its subjects are empty today (no stack
#   modules, imported packs, embedding model, exec allowlist or platform
#   versions - every pack declares requires: none). The one applicable
#   slice, hash-pinning preserved source material and detecting drift, is
#   done by hand in the two redaction logs; scripts/local/source_log_check.py
#   now enforces their current-state pins from the eval runner.
# - AGF 10.2 attention profiles record per-slot executors/tiers for a
#   calibrated capability; depths here are self-assessed and slots run
#   under one operator, so a profile today would record declarations, not
#   measurements. Blocked on calibration evidence (real rulings), not on a
#   runtime. The task register (10.1) is the present-day partial.
# - Depths in harness/task-register.md stay self-assessed and uncalibrated
#   (AGF 4.2 cap: no rating above what his rulings support); the writing
#   run log has unruled runs (routines/writing-runs.md).
# Corrected 2026-11-14 (decisions/log.md #34): this file migrated
# byte-identical from the retired methods repo and misdescribed this brain.
name: kairon-xyz-agent
version: 0.3.0
owner: Alejandro Arango
visibility: public  # agent/ inside the public site repo; never rendered on the site
default_branch_policy: lanes_per_contribution_workflow  # Tier 2 content: branch+PR or CMS commit; Tier 1 code/config: always PR
pack_class_max: S1
exports: packs/
gates:
  push_gate: scripts/local/push_gate.sh
  eval_contract: evals/contract.md
  routing_lint: scripts/local/routing_lint.py
