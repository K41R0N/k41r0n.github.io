name: copy-five-pass
kind: method
version: 0.2.1
status: draft
summary: Five deterministic passes over a draft (evidence, unresolved items, filler, plain reading, authority). Catches problems. Never certifies voice or quality.
class_max: S1
requires: { modules: [], secrets: [], egress: [] }
provides:
  skills: [copy-five-pass]
  evals: [evals/checks.py]
attention: { copy-five-pass: D1/E4 }
source: Pattern from his copy-review layers (decontamination, creative, tone, compliance) and the method-only idea of deterministic gates with fail, warn and clean results. The five passes here were designed in this repo from that pattern. Reconciled 2026-11-02: his actual review framework is now source-derived in packs/copywriting-methods (sources/copy-review-framework/review-pipeline.md) and the generalized drafting five-pass sits beside it; this pack stays the deterministic lint gate and never certifies creative quality, voice fit, or reader fit. Client rules (word caps, banned lists) are not carried.
