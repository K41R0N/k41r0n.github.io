# =============================================================================
# Kairon Portfolio — CMS Configuration (Sveltia CMS)
# =============================================================================
# Template file — admin/config.yml is generated from this at build time.
# Only PUBLIC_SITE_URL needs to be set as a Vercel env var.
#
# Hardcoded values:
#   repo     = K41R0N/k41r0n.github.io
#   base_url = https://sveltia-cms-auth.alejandro-057.workers.dev/
# =============================================================================

backend:
  name: github
  repo: K41R0N/k41r0n.github.io
  branch: main
  base_url: https://sveltia-cms-auth.alejandro-057.workers.dev/

media_folder: src/assets/images
public_folder: /assets/images

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:

  # ===========================================================================
  # HOME PAGE
  # Hero / About section copy — content/about.md
  # ===========================================================================
  - name: home
    label: Home Page
    files:
      - name: about
        label: Hero · About
        file: content/about.md
        fields:
          - label: Hero Copy
            name: body
            widget: markdown
            hint: >
              The introduction text below the wordmark in the multi-column hero section.
              Keep it short and direct — this is your statement, not a bio.

  # ===========================================================================
  # THESES
  # Thought-leadership pieces — content/theses/*.md
  # ===========================================================================
  - name: theses
    label: Theses
    label_singular: Thesis
    folder: content/theses
    create: true
    slug: '{{slug}}'
    sortable_fields: ['order', 'title']
    summary: '§{{order}} — {{title}}'
    preview_path: 'thesis-{{order}}-{{slug}}.html'
    fields:

      - label: Title
        name: title
        widget: string
        hint: "The thesis statement / headline"

      - label: Slug
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"]
        hint: "URL identifier — e.g. 'devices-as-co-creations'"

      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: "Display order (1, 2, 3…). Controls the TOC sequence and URL prefix."

      - label: Description
        name: description
        widget: text
        hint: >
          One-sentence summary. Appears in the TOC dot-leader row, the thesis page
          as the opening paragraph, SEO meta description, and llms.txt.

      - label: Body
        name: body
        widget: markdown
        required: false
        hint: >
          Extended body for the thesis detail page. Supports:
            > **Note:** text  →  margin note aside
            ---              →  section break
          The first paragraph gets a drop cap automatically.

      - label: Links
        name: links
        widget: list
        required: false
        label_singular: Link
        hint: "Supporting articles, tools, podcasts, and projects"
        fields:
          - label: Type
            name: label
            widget: select
            options:
              - { label: "Article", value: "Article" }
              - { label: "Tool", value: "Tool" }
              - { label: "Podcast", value: "Podcast" }
              - { label: "Project", value: "Project" }
              - { label: "Video", value: "Video" }
              - { label: "Curated Compilation", value: "Curated Compilation" }
            hint: "Content type — shown as a label above the link"
          - label: Title
            name: title
            widget: string
            hint: "Display title of the linked piece"
          - label: URL
            name: url
            widget: string
            hint: "Full URL"

  # ===========================================================================
  # SETTINGS
  # All site-wide copy and configuration — content/settings/site.json
  # ===========================================================================
  - name: settings
    label: Settings
    files:

      - name: site
        label: Site Settings
        file: content/settings/site.json
        fields:

          # ---- Identity -------------------------------------------------------
          - label: "Full Name"
            name: full_name
            widget: string
            hint: "Legal / full name — used in copyright, JSON-LD, and meta author"

          - label: "Wordmark — Line 1"
            name: wordmark_line1
            widget: string
            hint: "First line of the large display name (e.g. 'Alejandro')"

          - label: "Wordmark — Line 2"
            name: wordmark_line2
            widget: string
            hint: "Second line of the large display name (e.g. 'Arango')"

          - label: "Handle / Alias"
            name: author_handle
            widget: string
            hint: "Your alias used in section labels, nav, and the GitHub handle display (e.g. K41R0N)"

          - label: "Tagline"
            name: tagline
            widget: string
            hint: "One-liner title shown in the footer and used as fallback hero copy"

          - label: "Email"
            name: email
            widget: string
            hint: "Contact email — shown in the masthead and footer"

          # ---- Social ---------------------------------------------------------
          - label: "GitHub URL"
            name: github
            widget: string
            hint: "Full URL e.g. https://github.com/K41R0N"

          - label: "Substack URL"
            name: substack
            widget: string
            hint: "Full URL e.g. https://k41r0n.substack.com"

          - label: "Instagram URL"
            name: instagram
            widget: string
            required: false
            hint: "Full URL e.g. https://www.instagram.com/device.economies/"

          # ---- SEO ------------------------------------------------------------
          - label: "Site Title"
            name: title
            widget: string
            hint: "Short name used in browser tab and RSS feed title (e.g. 'Kairon')"

          - label: "Site Description"
            name: description
            widget: text
            hint: "SEO meta description — 1-2 sentences summarising the site"

          - label: "Site URL"
            name: site_url
            widget: string
            hint: "Production URL with protocol (e.g. https://kairon.xyz)"

          # ---- Newsletter Section ---------------------------------------------
          - label: "Newsletter Body"
            name: newsletter_body
            widget: text
            hint: "The paragraph above the subscribe link in the Newsletter section"

          - label: "Newsletter CTA Text"
            name: newsletter_cta
            widget: string
            hint: "Subscribe link text (e.g. 'Subscribe on Substack →')"

          # ---- Footer ---------------------------------------------------------
          - label: "Footer Text"
            name: footer_text
            widget: string
            required: false
            hint: "Tagline shown in the footer credits (e.g. 'Built with clarity, not breadth.')"

          - label: "Substack Embed URL"
            name: substack_embed
            widget: string
            required: false
            hint: "URL for the Substack embed iframe if used (e.g. https://k41r0n.substack.com/embed)"
