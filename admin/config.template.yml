# =============================================================================
# Kairon Portfolio — CMS Configuration (Sveltia CMS)
# =============================================================================
# Template file — admin/config.yml is generated from this at build time.
# Only PUBLIC_SITE_URL needs to be set as a Vercel env var.
#
# Hardcoded values:
#   repo     = K41R0N/k41r0n.github.io
#   base_url = https://sveltia-cms-auth.alejandro-057.workers.dev/
#
# COLLECTION STRUCTURE
# ──────────────────────────────────────────────────────────────────────────────
# Home Page    → everything that appears only on index.html
#   Hero · About      → content/about.md
#   Home Sections     → content/home.json  (headings, labels, newsletter copy)
#   Writing Links     → content/writing.json
#
# Theses       → content for home TOC rows + individual thesis detail pages
#
# Settings     → global config that appears on every page
#   Site Settings     → content/settings/site.json
# =============================================================================

backend:
  name: github
  repo: K41R0N/k41r0n.github.io
  branch: main
  base_url: https://sveltia-cms-auth.alejandro-057.workers.dev/

media_folder: src/assets/images
public_folder: /assets/images

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:

  # ===========================================================================
  # HOME PAGE
  # Three files — all specific to index.html
  # ===========================================================================
  - name: home
    label: Home Page
    files:

      # ---- Hero intro copy --------------------------------------------------
      - name: about
        label: Hero · About
        file: content/about.md
        fields:
          - label: Hero Copy
            name: body
            widget: markdown
            hint: >
              The intro text in the hero section below the wordmark. Plain text
              or markdown. Keep it short — this is your statement, not a bio.

      # ---- Section headings, labels, newsletter copy -----------------------
      - name: home_sections
        label: Home · Sections & Newsletter
        file: content/home.json
        fields:

          - label: "Logo Alt Text"
            name: logo_alt
            widget: string
            default: "Kairon"
            hint: "Accessible alt text for the logo mark image."

          - label: "Theses — Section Heading"
            name: section_theses
            widget: string
            default: "Theses"
            hint: "The h3 heading above the thesis index (e.g. 'Theses', 'Essays')."

          - label: "Theses — Sub-label"
            name: section_theses_label
            widget: string
            default: "index"
            hint: "Mono label to the right of the rule. Displayed uppercase."

          - label: "Writing — Section Heading"
            name: section_writing
            widget: string
            default: "Writing"
            hint: "The h3 heading above the curated links section."

          - label: "Writing — Sub-label"
            name: section_writing_label
            widget: string
            default: "links"
            hint: "Mono label to the right of the rule."

          - label: "Writing — Intro Text"
            name: section_writing_intro
            widget: string
            required: false
            hint: "Optional one-line intro above the writing links. Leave blank to skip."

          - label: "Newsletter — Section Heading"
            name: section_newsletter
            widget: string
            default: "Newsletter"
            hint: "The h3 heading above the newsletter section."

          - label: "Newsletter — Sub-label"
            name: section_newsletter_label
            widget: string
            default: "subscribe"
            hint: "Mono label to the right of the rule."

          - label: "Newsletter Body"
            name: newsletter_body
            widget: text
            hint: "The paragraph above the subscribe link."

          - label: "Newsletter CTA Text"
            name: newsletter_cta
            widget: string
            hint: "Subscribe link text (e.g. 'Subscribe on Substack →')."

      # ---- Writing links — curated, independently editable -----------------
      - name: writing
        label: Writing Links
        file: content/writing.json
        fields:
          - label: Links
            name: links
            widget: list
            label_singular: Link
            hint: >
              Curated list of articles, podcasts, tools, and projects shown
              in the Writing section on the home page. Edit freely — these are
              independent of the thesis link lists.
            fields:
              - label: Type
                name: label
                widget: select
                options:
                  - { label: "Article", value: "Article" }
                  - { label: "Tool", value: "Tool" }
                  - { label: "Podcast", value: "Podcast" }
                  - { label: "Project", value: "Project" }
                  - { label: "Video", value: "Video" }
                  - { label: "Curated Compilation", value: "Curated Compilation" }
                hint: "Content type — shown as a label."
              - label: Title
                name: title
                widget: string
                hint: "Display title."
              - label: URL
                name: url
                widget: string
                hint: "Full URL including https://"

  # ===========================================================================
  # BLOG
  # Articles and essays — content/blog/*.md
  # Renders at /blog/index.html (listing) and /blog/{slug}.html (posts)
  # All posts appear in /feed.xml for RSS syndication (Paragraph auto-import)
  # ===========================================================================
  - name: blog
    label: Blog
    label_singular: Post
    folder: content/blog
    create: true
    slug: '{{date}}-{{slug}}'
    sortable_fields: ['date', 'title']
    summary: '{{date}} — {{title}}'
    preview_path: 'blog/{{slug}}.html'
    fields:

      - label: Title
        name: title
        widget: string
        hint: "Post headline."

      - label: Slug
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"]
        hint: "URL identifier — e.g. 'techno-feudalistic-quixote'. Used in /blog/{slug}.html."

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD"
        hint: "Publication date. Used for ordering and RSS pubDate."

      - label: Description
        name: description
        widget: text
        hint: >
          One-sentence summary. Appears in the blog listing, RSS feed,
          SEO meta description, and llms.txt. This is what Paragraph and
          RSS readers show as the article preview.

      - label: Cover Image
        name: cover_image
        widget: image
        required: false
        hint: >
          Upload a 1:1 square SVG or image. Shown in the article hero and on the
          /blog/ listing. SVGs work best — they scale perfectly at any size.

      - label: Tags
        name: tags
        widget: list
        required: false
        hint: "Topic tags — optional. Shown in the article eyebrow."

      - label: Body
        name: body
        widget: markdown
        required: false
        hint: >
          Full article content. Supports:
            > **Note:** text   →  renders as a margin note aside
            ---                →  section break rule
          The first paragraph gets a drop cap if it starts with 3+ letters.

  # ===========================================================================
  # THESES
  # Each thesis drives: a dot-leader row on the home page TOC
  #                     + a full detail page at thesis-NN-{slug}.html
  #
  # Field guide:
  #   title       → TOC heading (home) + h1 + nav breadcrumb (detail page)
  #   description → TOC description text (home) + SEO <meta> (detail page)
  #                 NOTE: description is NOT rendered as visible text on the
  #                 detail page. Only the body is shown there.
  #   body        → Article content on the detail page
  #   links       → "Links" block at the bottom of the detail page
  # ===========================================================================
  - name: theses
    label: Theses
    label_singular: Thesis
    folder: content/theses
    create: true
    slug: '{{slug}}'
    sortable_fields: ['order', 'title']
    summary: '§{{order}} — {{title}}'
    fields:

      - label: Title
        name: title
        widget: string
        hint: "The thesis headline. Appears in the home TOC and as the h1 on the detail page."

      - label: Slug
        name: slug
        widget: string
        pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"]
        hint: "URL identifier — e.g. 'devices-as-co-creations'. Changing this breaks inbound links."

      - label: Order
        name: order
        widget: number
        value_type: int
        min: 1
        hint: "Display order (1, 2, 3…). Controls TOC sequence, URL prefix, and chapter nav."

      - label: Description
        name: description
        widget: text
        hint: >
          One-sentence summary. Appears as the dot-leader description in the
          home TOC and as the SEO meta description on the detail page.
          It does NOT appear as visible body text on the detail page — use Body for that.

      - label: Body
        name: body
        widget: markdown
        required: false
        hint: >
          Article content shown on the thesis detail page. Supports:
            > **Note:** text   →  margin note aside
            ---                →  section break rule
          First paragraph gets a drop cap if it starts with 3+ letters.

      - label: Links
        name: links
        widget: list
        required: false
        label_singular: Link
        hint: "Supporting links shown in the Links block on the thesis detail page."
        fields:
          - label: Type
            name: label
            widget: select
            options:
              - { label: "Article", value: "Article" }
              - { label: "Tool", value: "Tool" }
              - { label: "Podcast", value: "Podcast" }
              - { label: "Project", value: "Project" }
              - { label: "Video", value: "Video" }
              - { label: "Curated Compilation", value: "Curated Compilation" }
            hint: "Content type label."
          - label: Title
            name: title
            widget: string
          - label: URL
            name: url
            widget: string
            hint: "Full URL including https://"

  # ===========================================================================
  # SETTINGS
  # Global config — appears on every page (home + all thesis pages)
  # ===========================================================================
  - name: settings
    label: Settings
    files:

      - name: site
        label: Site Settings
        file: content/settings/site.json
        fields:

          # ---- Identity -------------------------------------------------------
          - label: "Full Name"
            name: full_name
            widget: string
            hint: "Legal name — used in copyright and JSON-LD schema."

          - label: "Wordmark — Line 1"
            name: wordmark_line1
            widget: string
            hint: "First line of the large display name in the masthead (e.g. 'Alejandro')."

          - label: "Wordmark — Line 2"
            name: wordmark_line2
            widget: string
            hint: "Second line (e.g. 'Arango')."

          - label: "Handle / Alias"
            name: author_handle
            widget: string
            hint: "Your alias — used in section labels, nav breadcrumbs, and the GitHub metric."

          - label: "Tagline"
            name: tagline
            widget: string
            hint: "One-liner role — shown in the footer."

          - label: "Email"
            name: email
            widget: string
            hint: "Contact email — shown in the masthead and footer."

          # ---- Social ---------------------------------------------------------
          - label: "GitHub URL"
            name: github
            widget: string
            hint: "e.g. https://github.com/K41R0N"

          - label: "Substack URL"
            name: substack
            widget: string
            hint: "e.g. https://k41r0n.substack.com"

          - label: "Instagram URL"
            name: instagram
            widget: string
            required: false
            hint: "e.g. https://www.instagram.com/device.economies/"

          # ---- SEO ------------------------------------------------------------
          - label: "Site Title"
            name: title
            widget: string
            hint: "Short name — appears in browser tab, RSS, and ← nav on thesis pages."

          - label: "Site Description"
            name: description
            widget: text
            hint: "SEO meta description — 1–2 sentences."

          - label: "Site URL"
            name: site_url
            widget: string
            hint: "Production URL with protocol (e.g. https://kairon.xyz)."

          # ---- Thesis Pages ---------------------------------------------------
          - label: "Thesis — Nav Label"
            name: thesis_nav_label
            widget: string
            default: "Thesis"
            hint: "Word before the number in thesis nav and eyebrow (e.g. 'Thesis', 'Essay')."

          - label: "Thesis — Links Section Heading"
            name: thesis_links_heading
            widget: string
            default: "Links"
            hint: "h3 heading above the links block on each thesis detail page."

          - label: "Thesis — Links Sub-label"
            name: thesis_links_label
            widget: string
            default: "references"
            hint: "Mono label beside the links section rule."

          - label: "Thesis — Next Label"
            name: thesis_next_label
            widget: string
            default: "Next"
            hint: "Prefix on the next-thesis link at the bottom of each detail page."

          # ---- Footer ---------------------------------------------------------
          - label: "Footer Text"
            name: footer_text
            widget: string
            required: false
            hint: "Tagline in the footer credits block."

          - label: "Substack Embed URL"
            name: substack_embed
            widget: string
            required: false
            hint: "Substack embed iframe URL if used."
